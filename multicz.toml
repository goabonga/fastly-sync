# multicz.toml - versioning, changelog and tagging driven by Conventional
# Commits. Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
# No tags exist yet; first release is computed from history at initial_version.
tag_format = "v{version}"
initial_version = "0.0.0"
# Regenerate uv.lock after each bump so the lockfile tracks the new version;
# without `allow` multicz skips the hook and the next `uv sync --frozen` in
# CI fails on lockfile drift.
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"
deprecate = "minor"
remove = "minor"

# Keep-a-Changelog buckets; commits route to the section whose `types` match.
[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Deprecated"
types = ["deprecate"]

[[project.changelog_sections]]
title = "Removed"
types = ["remove"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[components.fastly-sync]
# Curated: only the source + packaging file count toward a release.
# Everything else (LICENSE, README, .github, docs, tests, scripts, tooling)
# is intentionally untracked.
paths = ["src/**", "pyproject.toml"]
bump_files = [
    { file = "pyproject.toml", key = "project.version" },
    { file = "src/fastly_sync/__init__.py", key = "regex:__version__\\s*=\\s*[\"']([^\"']+)[\"']" },
]
changelog = "CHANGELOG.md"
post_bump = ["uv lock"]

[[components.fastly-sync.artifacts]]
type = "pypi"
ref = "fastly-sync=={version}"
