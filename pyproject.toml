[project]
name = "fastly-sync"
version = "0.3.0"
description = "Synchronise Fastly CDN, rate limiter and WAF IP blocklist configuration on demand."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["fastly", "cdn", "rate-limiter", "waf", "acl", "openapi", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2",
    "typer>=0.12",
]

[project.scripts]
fastly-sync = "fastly_sync.cli:app"

[project.urls]
Homepage = "https://github.com/goabonga/fastly-sync"
Repository = "https://github.com/goabonga/fastly-sync"
Issues = "https://github.com/goabonga/fastly-sync/issues"
Changelog = "https://github.com/goabonga/fastly-sync/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastly_sync"]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.8",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=4",
]
doc = [
    "zensical",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=fastly_sync",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer requires `typer.Option(...)` calls as parameter defaults (B008).
"src/fastly_sync/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
